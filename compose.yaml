# Production : docker compose up -d --build
# Le dépôt du front doit être à côté de celui-ci (../projmulti-frontend), ou FRONTEND_PATH.
name: projmulti

services:
  app:
    build:
      context: .
      additional_contexts:
        frontend: ${FRONTEND_PATH:-../projmulti-frontend}
    image: projmulti-app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--max-allowed-packet=64M"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  db-data:
  app-storage:

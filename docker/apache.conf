ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Les fichiers compilés ont un hash dans leur nom : cache long.
    <LocationMatch "^/(js|css|img|fonts)/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    # Pas de source maps en production.
    <FilesMatch "\.map$">
        Require all denied
    </FilesMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

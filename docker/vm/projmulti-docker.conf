# Apache de la VM : termine le HTTPS et fait proxy vers le conteneur app (compose.yaml).
# Installation : /etc/apache2/sites-available/ ; a2enmod ssl proxy proxy_http headers ; a2ensite projmulti-docker
<VirtualHost *:80>
    ServerName tin-projmulti.einet.ch
    Redirect permanent / https://tin-projmulti.einet.ch/
</VirtualHost>

<VirtualHost *:443>
    ServerName tin-projmulti.einet.ch

    SSLEngine on
    SSLCertificateFile    /cert/prjmulthost.crt
    SSLCertificateKeyFile /cert/prjmulthost.key

    ProxyPreserveHost On
    ProxyTimeout 120
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
    RequestHeader set X-Forwarded-Proto "https"

    # Descriptions de projet avec images : jusqu'à 64 Mo par requête.
    LimitRequestBody 67108864

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access-prj-ssl.log combined
</VirtualHost>

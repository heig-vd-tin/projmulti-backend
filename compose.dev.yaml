# Développement local : docker compose -f compose.yaml -f compose.dev.yaml up -d --build
# Les sources PHP sont montées dans le conteneur (modifications prises en compte sans rebuild).
services:
  app:
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    ports: !override
      - "127.0.0.1:8080:80"
    volumes:
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./lang:/var/www/html/lang
      - ./bootstrap/app.php:/var/www/html/bootstrap/app.php

  db:
    ports:
      - "127.0.0.1:3307:3306"
